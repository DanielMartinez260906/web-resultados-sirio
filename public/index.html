<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Iniciar sesión en el portal de resultados - Laboratorio Clínico SIRIO">
  <title>Iniciar Sesión - Laboratorio Clínico SIRIO</title>

  <link rel="icon" type="image/png" href="pwa-icon.png">
  <link rel="apple-touch-icon" href="pwa-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Botón de tema flotante -->
  <div style="position: fixed; top: 16px; right: 16px; z-index: 1000;">
    <button class="btn btn-secondary btn-icon" id="theme-toggle"
            style="border-radius: 50%; width: 44px; height: 44px;" title="Cambiar tema">
      <i class="fa-solid fa-sun"></i>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="login-card" style="position: relative; overflow: hidden;">
      <!-- Íconos Decorativos de Laboratorio -->
      <div class="lab-decor decoration-top-right"><i class="fa-solid fa-flask-vial"></i></div>
      <div class="lab-decor decoration-bottom-left"><i class="fa-solid fa-microscope"></i></div>

      <div class="brand-header">
        <img src="logo.png" alt="Laboratorio Sirio Logo"
             style="max-width: 330px; width: 100%; height: auto; margin: 0 auto 0.75rem auto;">
        <p>Portal Web de Resultados y Análisis Clínicos</p>
      </div>

      <!-- Alerta de Error -->
      <div id="login-alert" class="alert alert-error" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="alert-message">Credenciales incorrectas.</span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Nombre de Usuario</label>
          <div style="position: relative;">
            <i class="fa-solid fa-user"
               style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dark); pointer-events: none;"></i>
            <input type="text" id="username" class="form-control"
                   placeholder="Ej: pedro.gonzalez"
                   style="padding-left: 46px;"
                   required autocomplete="username">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div style="position: relative;">
            <i class="fa-solid fa-lock"
               style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dark); pointer-events: none;"></i>
            <input type="password" id="password" class="form-control"
                   placeholder="••••••••"
                   style="padding-left: 46px; padding-right: 50px;"
                   required autocomplete="current-password">
            <button type="button" id="toggle-password"
                    style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
                           background: none; border: none; cursor: pointer; color: var(--text-dark);
                           padding: 4px; display: flex; align-items: center; justify-content: center;
                           transition: color 0.2s;" title="Mostrar/ocultar contraseña">
              <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="remember-me" checked>
            <span>Recordarme</span>
          </label>
        </div>

        <button type="submit" class="btn btn-primary"
                style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 0.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Portal
        </button>
      </form>

      <!-- Accesos Rápidos para Administradores / Personal (Solo visible si hay perfiles guardados en esta PC) -->
      <div id="admin-quick-select-section" style="display: none; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px dashed var(--border-light);">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem;">
          <span style="font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-dark); display: flex; align-items: center; gap: 5px;">
            <i class="fa-solid fa-users-gear" style="color: var(--color-primary);"></i> Cuentas del Personal
          </span>
          <span style="font-size: 0.7rem; color: var(--text-dark);">En este equipo</span>
        </div>
        <div id="admin-quick-chips" style="display: flex; flex-direction: column; gap: 6px;">
          <!-- Se inyectan dinámicamente -->
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Laboratorio Clínico SIRIO. Todos los derechos reservados.</p>
    <div class="developer-credits">
      <span class="dev-credits-label">Desarrollado por</span>
      <div class="dev-credits-brand">
        <a href="https://wa.me/573053234702?text=Hola%20DAMEDIA%2C%20me%20interesa%20obtener%20informaci%C3%B3n%20sobre%20un%20software." target="_blank" rel="noopener noreferrer" class="dev-link" title="Contactar a DAMEDIA por WhatsApp">
          <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 1.3rem;"></i>
          <img src="img/damedia-icon.png" alt="DAMEDIA Isotipo" class="dev-icon">
          <img src="img/damedia-logo.png" alt="DAMEDIA Logotipo" class="dev-logo">
        </a>
      </div>
      <span class="dev-credits-tagline">Desarrollamos software, impulsamos empresas.</span>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/network-bg.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      SirioAuth.checkSession();

      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const alertMsg = document.getElementById('alert-message');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      // Renderizar perfiles de administradores guardados en este navegador (si existen)
      function renderAdminQuickProfiles() {
        const section = document.getElementById('admin-quick-select-section');
        const chipsContainer = document.getElementById('admin-quick-chips');
        if (!section || !chipsContainer) return;

        const profiles = SirioAuth.getSavedAdminProfiles();
        if (!profiles || profiles.length === 0) {
          section.style.display = 'none';
          return;
        }

        section.style.display = 'block';
        chipsContainer.innerHTML = profiles.slice(0, 4).map(p => {
          if (!p || typeof p !== 'object') return '';
          const rawUname = p.username !== undefined ? p.username : (p.usuario !== undefined ? p.usuario : '');
          const uname = String(rawUname || '').trim();
          if (!uname) return '';

          let roleBadge = 'Personal';
          let roleColor = '#0ea5e9';
          let roleBg = 'rgba(14, 165, 233, 0.12)';
          const roleStr = String(p.rol || '').toLowerCase().trim();
          if (roleStr === 'jefas') {
            roleBadge = 'Jefa 👑';
            roleColor = '#f472b6';
            roleBg = 'rgba(244, 114, 182, 0.12)';
          } else if (roleStr === 'programadores') {
            roleBadge = 'Dev 💻';
            roleColor = '#c084fc';
            roleBg = 'rgba(192, 132, 252, 0.12)';
          }

          return `
            <div class="admin-quick-chip" data-username="${uname}" style="display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-light); cursor: pointer; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--color-primary)'; this.style.background='rgba(14, 165, 233, 0.08)';" onmouseout="this.style.borderColor='var(--border-light)'; this.style.background='rgba(255, 255, 255, 0.03)';">
              <div style="display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1;">
                <div style="width: 26px; height: 26px; border-radius: 50%; background: ${roleBg}; color: ${roleColor}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; flex-shrink: 0;">
                  ${String(p.nombre || uname || 'A').charAt(0).toUpperCase()}
                </div>
                <div style="min-width: 0; flex: 1; text-align: left;">
                  <span style="font-weight: 600; font-size: 0.82rem; color: var(--text-main); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${String(p.nombre || uname)}
                  </span>
                  <span style="font-size: 0.7rem; color: var(--text-dark);">@${uname}</span>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 6px;">
                <span style="font-size: 0.68rem; color: ${roleColor}; background: ${roleBg}; padding: 1px 5px; border-radius: 4px; font-weight: 500;">${roleBadge}</span>
                <i class="fa-solid fa-arrow-right-to-bracket" style="font-size: 0.75rem; color: var(--color-primary); opacity: 0.7;"></i>
              </div>
            </div>
          `;
        }).join('');

        // Clic en chip -> Ingreso directo instantáneo 1-clic al panel de administración
        chipsContainer.querySelectorAll('.admin-quick-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            const uname = chip.getAttribute('data-username');
            if (uname) {
              SirioAuth.showLoading(`Accediendo como @${uname}...`);
              const ok = SirioAuth.switchToAdminProfile(uname);
              if (ok) {
                setTimeout(() => {
                  window.location.href = 'admin.html';
                }, 300);
              } else {
                SirioAuth.hideLoading();
                if (usernameInput && passwordInput) {
                  usernameInput.value = uname;
                  passwordInput.focus();
                }
              }
            }
          });
        });
      }

      renderAdminQuickProfiles();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = document.getElementById('remember-me').checked;

        alertBox.style.display = 'none';
        SirioAuth.showLoading('Autenticando...');

        const result = await SirioAuth.login(username, password, rememberMe);

        SirioAuth.hideLoading();

        if (result.success) {
          if (['admin', 'jefas', 'programadores'].includes(result.user.rol)) {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'client.html';
          }
        } else {
          alertMsg.innerText = result.message;
          alertBox.style.display = 'flex';
        }
      });
      // Toggle mostrar/ocultar contraseña
      const toggleBtn  = document.getElementById('toggle-password');
      const toggleIcon = document.getElementById('toggle-password-icon');
      const pwdInput   = document.getElementById('password');
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type  = isHidden ? 'text' : 'password';
        toggleIcon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        toggleBtn.style.color = isHidden ? 'var(--color-primary)' : 'var(--text-dark)';
      });
    });
  </script>
</body>
</html>
