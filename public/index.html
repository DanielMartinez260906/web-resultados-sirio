<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Iniciar sesión en el portal de resultados - Laboratorio Clínico SIRIO">
  <title>Iniciar Sesión - Laboratorio Clínico SIRIO</title>

  <link rel="icon" type="image/png" href="pwa-icon.png">
  <link rel="apple-touch-icon" href="pwa-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Botón de tema flotante -->
  <div style="position: fixed; top: 16px; right: 16px; z-index: 1000;">
    <button class="btn btn-secondary btn-icon" id="theme-toggle"
            style="border-radius: 50%; width: 44px; height: 44px;" title="Cambiar tema">
      <i class="fa-solid fa-sun"></i>
    </button>
  </div>

  <div class="login-wrapper">
    <div class="login-card" style="position: relative; overflow: hidden;">
      <!-- Íconos Decorativos de Laboratorio -->
      <div class="lab-decor decoration-top-right"><i class="fa-solid fa-flask-vial"></i></div>
      <div class="lab-decor decoration-bottom-left"><i class="fa-solid fa-microscope"></i></div>

      <div class="brand-header">
        <img src="logo.png" alt="Laboratorio Sirio Logo"
             style="max-width: 330px; width: 100%; height: auto; margin: 0 auto 0.75rem auto;">
        <p>Portal Web de Resultados y Análisis Clínicos</p>
      </div>

      <!-- Alerta de Error -->
      <div id="login-alert" class="alert alert-error" style="display: none;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span id="alert-message">Credenciales incorrectas.</span>
      </div>

      <!-- ── VISTA 1: Selector de Cuentas Guardadas (Elegir una cuenta) ── -->
      <div id="account-chooser-view" style="display: none;">
        <div style="text-align: center; margin-bottom: 1.25rem;">
          <h3 style="font-size: 1.25rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px;">
            Elegir una cuenta
          </h3>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">
            Cuentas del personal guardadas en este equipo
          </p>
        </div>

        <div id="chooser-accounts-list" style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 1.25rem; max-height: 320px; overflow-y: auto; padding-right: 2px;">
          <!-- Inyectado dinámicamente -->
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button type="button" id="btn-use-another-account" class="btn btn-secondary"
                  style="width: 100%; padding: 12px; font-size: 0.92rem; display: flex; align-items: center; justify-content: center; gap: 8px; border-style: dashed;">
            <i class="fa-solid fa-user-plus" style="color: var(--color-primary);"></i>
            <span>Iniciar sesión con otra cuenta</span>
          </button>
        </div>
      </div>

      <!-- ── VISTA 2: Formulario Tradicional de Inicio de Sesión ── -->
      <div id="traditional-login-view" style="display: block;">
        <div id="back-to-accounts-container" style="display: none; margin-bottom: 1rem; text-align: left;">
          <button type="button" id="btn-back-to-accounts"
                  style="background: none; border: none; font-size: 0.82rem; color: var(--color-primary); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> Volver a las cuentas guardadas
          </button>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="username">Nombre de Usuario</label>
            <div style="position: relative;">
              <i class="fa-solid fa-user"
                 style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dark); pointer-events: none;"></i>
              <input type="text" id="username" class="form-control"
                     placeholder="Ej: pedro.gonzalez"
                     style="padding-left: 46px;"
                     required autocomplete="username">
            </div>
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <div style="position: relative;">
              <i class="fa-solid fa-lock"
                 style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-dark); pointer-events: none;"></i>
              <input type="password" id="password" class="form-control"
                     placeholder="••••••••"
                     style="padding-left: 46px; padding-right: 50px;"
                     required autocomplete="current-password">
              <button type="button" id="toggle-password"
                      style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
                             background: none; border: none; cursor: pointer; color: var(--text-dark);
                             padding: 4px; display: flex; align-items: center; justify-content: center;
                             transition: color 0.2s;" title="Mostrar/ocultar contraseña">
                <i class="fa-solid fa-eye" id="toggle-password-icon"></i>
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember-me">
              <input type="checkbox" id="remember-me" checked>
              <span>Recordarme</span>
            </label>
          </div>

          <button type="submit" class="btn btn-primary"
                  style="width: 100%; padding: 14px; font-size: 1rem; margin-top: 0.5rem;">
            <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Portal
          </button>
        </form>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2026 Laboratorio Clínico SIRIO. Todos los derechos reservados.</p>
    <div class="developer-credits">
      <span class="dev-credits-label">Desarrollado por</span>
      <div class="dev-credits-brand">
        <a href="https://wa.me/573053234702?text=Hola%20DAMEDIA%2C%20me%20interesa%20obtener%20informaci%C3%B3n%20sobre%20un%20software." target="_blank" rel="noopener noreferrer" class="dev-link" title="Contactar a DAMEDIA por WhatsApp">
          <i class="fa-brands fa-whatsapp" style="color: #25d366; font-size: 1.3rem;"></i>
          <img src="img/damedia-icon.png" alt="DAMEDIA Isotipo" class="dev-icon">
          <img src="img/damedia-logo.png" alt="DAMEDIA Logotipo" class="dev-logo">
        </a>
      </div>
      <span class="dev-credits-tagline">Desarrollamos software, impulsamos empresas.</span>
    </div>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/network-bg.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Verificar sesión previa
      SirioAuth.checkSession();

      const accountChooserView = document.getElementById('account-chooser-view');
      const chooserAccountsList = document.getElementById('chooser-accounts-list');
      const traditionalLoginView = document.getElementById('traditional-login-view');
      const backToAccountsContainer = document.getElementById('back-to-accounts-container');
      const btnUseAnotherAccount = document.getElementById('btn-use-another-account');
      const btnBackToAccounts = document.getElementById('btn-back-to-accounts');

      const form = document.getElementById('login-form');
      const alertBox = document.getElementById('login-alert');
      const alertMsg = document.getElementById('alert-message');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      function showAlert(msg) {
        alertMsg.innerText = msg;
        alertBox.style.display = 'flex';
      }

      function hideAlert() {
        alertBox.style.display = 'none';
      }

      // Renderizar el selector de cuentas del personal
      function renderAccountChooser() {
        const profiles = SirioAuth.getSavedAdminProfiles();

        // Si NO hay perfiles guardados de personal, mostrar directamente el login tradicional
        if (!profiles || profiles.length === 0) {
          accountChooserView.style.display = 'none';
          traditionalLoginView.style.display = 'block';
          backToAccountsContainer.style.display = 'none';
          return false;
        }

        // Si hay perfiles guardados, mostrar la pantalla de selección de cuentas
        accountChooserView.style.display = 'block';
        traditionalLoginView.style.display = 'none';
        backToAccountsContainer.style.display = 'block';

        chooserAccountsList.innerHTML = profiles.map(p => {
          if (!p || typeof p !== 'object') return '';
          const rawUname = p.username !== undefined ? p.username : (p.usuario !== undefined ? p.usuario : '');
          const uname = String(rawUname || '').trim();
          if (!uname) return '';

          let roleBadge = 'Personal';
          let roleColor = '#0ea5e9';
          let roleBg = 'rgba(14, 165, 233, 0.12)';
          let roleIcon = 'fa-solid fa-user-shield';
          const roleStr = String(p.rol || '').toLowerCase().trim();

          if (roleStr === 'jefas') {
            roleBadge = 'Jefa';
            roleColor = '#f472b6';
            roleBg = 'rgba(244, 114, 182, 0.12)';
            roleIcon = 'fa-solid fa-crown';
          } else if (roleStr === 'programadores') {
            roleBadge = 'Desarrollador';
            roleColor = '#c084fc';
            roleBg = 'rgba(192, 132, 252, 0.12)';
            roleIcon = 'fa-solid fa-laptop-code';
          }

          const initial = String(p.nombre || uname || 'A').charAt(0).toUpperCase();

          return `
            <div class="saved-account-row" data-username="${uname}" style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 1.5px solid var(--border-light); cursor: pointer; transition: all 0.2s;" onmouseover="this.style.borderColor='var(--color-primary)'; this.style.background='rgba(14, 165, 233, 0.08)';" onmouseout="this.style.borderColor='var(--border-light)'; this.style.background='rgba(255, 255, 255, 0.03)';">
              <div class="account-click-zone" style="display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1;">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: ${roleBg}; color: ${roleColor}; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.05rem; flex-shrink: 0; border: 1px solid ${roleColor}40;">
                  ${initial}
                </div>
                <div style="min-width: 0; flex: 1; text-align: left;">
                  <div style="font-weight: 600; font-size: 0.92rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                    ${String(p.nombre || uname)}
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px; margin-top: 2px;">
                    <span style="font-size: 0.75rem; color: var(--text-dark);">@${uname}</span>
                    <span style="font-size: 0.68rem; color: ${roleColor}; background: ${roleBg}; padding: 1px 6px; border-radius: 4px; font-weight: 600; display: inline-flex; align-items: center; gap: 3px;">
                      <i class="${roleIcon}" style="font-size: 0.65rem;"></i> ${roleBadge}
                    </span>
                  </div>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <button type="button" class="btn-remove-saved-account" data-username="${uname}" title="Quitar de este equipo" style="background: none; border: none; width: 28px; height: 28px; border-radius: 6px; color: var(--text-dark); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0;" onmouseover="this.style.color='#ef4444'; this.style.background='rgba(239,68,68,0.1)';" onmouseout="this.style.color='var(--text-dark)'; this.style.background='none';">
                  <i class="fa-solid fa-xmark" style="font-size: 0.85rem;"></i>
                </button>
                <div class="account-click-zone" style="color: var(--color-primary); padding-left: 2px;">
                  <i class="fa-solid fa-chevron-right" style="font-size: 0.85rem; opacity: 0.7;"></i>
                </div>
              </div>
            </div>
          `;
        }).join('');

        // Manejar clics para ingresar a cuentas guardadas
        chooserAccountsList.querySelectorAll('.saved-account-row').forEach(row => {
          const uname = row.getAttribute('data-username');
          const clickZones = row.querySelectorAll('.account-click-zone');
          clickZones.forEach(zone => {
            zone.addEventListener('click', () => {
              if (!uname) return;
              
              // Buscar información del perfil guardado
              const profile = profiles.find(p => String(p.username || p.usuario || '').trim().toLowerCase() === uname.toLowerCase());
              const roleStr = String(profile?.rol || '').toLowerCase().trim();

              // REGLA DE SEGURIDAD:
              // Si la cuenta tiene rol 'programadores' o 'jefas', SIEMPRE pedir la contraseña.
              if (roleStr === 'programadores' || roleStr === 'jefas') {
                accountChooserView.style.display = 'none';
                traditionalLoginView.style.display = 'block';
                if (usernameInput && passwordInput) {
                  usernameInput.value = uname;
                  passwordInput.value = '';
                  passwordInput.focus();
                }
                const roleLabel = roleStr === 'jefas' ? 'Jefa' : 'Programador / Dev';
                showAlert(`Por seguridad, introduce la contraseña para la cuenta de ${roleLabel} (@${uname}).`);
                return;
              }

              // Si es administrador general / otro personal, permitir acceso directo
              SirioAuth.showLoading(`Accediendo como @${uname}...`);
              const ok = SirioAuth.switchToAdminProfile(uname);
              if (ok) {
                setTimeout(() => {
                  window.location.href = 'admin.html';
                }, 250);
              } else {
                SirioAuth.hideLoading();
                accountChooserView.style.display = 'none';
                traditionalLoginView.style.display = 'block';
                if (usernameInput && passwordInput) {
                  usernameInput.value = uname;
                  passwordInput.focus();
                }
              }
            });
          });
        });

        // Manejar clics para remover perfiles guardados
        chooserAccountsList.querySelectorAll('.btn-remove-saved-account').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const uname = btn.getAttribute('data-username');
            if (uname) {
              SirioAuth.removeAdminProfile(uname);
              renderAccountChooser();
            }
          });
        });

        return true;
      }

      // Inicializar selector de cuentas
      renderAccountChooser();

      // Botón: Iniciar sesión con otra cuenta
      if (btnUseAnotherAccount) {
        btnUseAnotherAccount.addEventListener('click', () => {
          accountChooserView.style.display = 'none';
          traditionalLoginView.style.display = 'block';
          if (usernameInput) {
            usernameInput.value = '';
            usernameInput.focus();
          }
          if (passwordInput) passwordInput.value = '';
          hideAlert();
        });
      }

      // Botón: Volver a las cuentas guardadas
      if (btnBackToAccounts) {
        btnBackToAccounts.addEventListener('click', () => {
          hideAlert();
          renderAccountChooser();
        });
      }

      // Envío de formulario tradicional
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        const rememberMe = document.getElementById('remember-me').checked;

        hideAlert();
        SirioAuth.showLoading('Autenticando...');

        const result = await SirioAuth.login(username, password, rememberMe);

        SirioAuth.hideLoading();

        if (result.success) {
          if (['admin', 'jefas', 'programadores'].includes(result.user.rol)) {
            window.location.href = 'admin.html';
          } else {
            // Clientes van directo a su portal
            window.location.href = 'client.html';
          }
        } else {
          showAlert(result.message || 'Credenciales incorrectas.');
        }
      });

      // Toggle mostrar/ocultar contraseña
      const toggleBtn  = document.getElementById('toggle-password');
      const toggleIcon = document.getElementById('toggle-password-icon');
      const pwdInput   = document.getElementById('password');
      toggleBtn.addEventListener('click', () => {
        const isHidden = pwdInput.type === 'password';
        pwdInput.type  = isHidden ? 'text' : 'password';
        toggleIcon.className = isHidden ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye';
        toggleBtn.style.color = isHidden ? 'var(--color-primary)' : 'var(--text-dark)';
      });
    });
  </script>
</body>
</html>
